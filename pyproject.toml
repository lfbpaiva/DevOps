[tool.pytest.ini_options]
testpaths = ["tests", "test_calculadora.py", "test_desconto.py"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app", "calculadora"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
